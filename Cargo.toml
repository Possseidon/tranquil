[workspace]
resolver = "3"
members = ["tranquil", "tranquil-macros"]
default-members = ["tranquil"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Possseidon <xpossseidon@gmail.com>"]
repository = "https://github.com/Possseidon/tranquil"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
tranquil.path = "tranquil"
tranquil-macros.path = "tranquil-macros"

ahash = "0.8.12"
anyhow = "1.0.100"
convert_case = "0.10.0"
darling = "0.21.3"
deranged = "0.5.5"
dotenvy = "0.15.7"
itertools = "0.14.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
reqwest = "0.12.24"
serde = "1.0.228"
syn = "2.0.111"
thiserror = "2.0.17"
time = "0.3.44"
tokio = "1.48.0"
tokio-tungstenite = { version = "0.28.0", default-features = false }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
unicode-script = "0.5.7"
uuid = "1.18.1"
